name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install hashed Python test dependencies
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          -r tools/requirements-release.txt

      - name: Install and run locked actionlint
        run: |
          ACTIONLINT_VERSION="$(node -p "require('./tools/toolchain.lock.json').hostTools.actionlint.version")"
          mkdir -p "$RUNNER_TEMP/actionlint-bin"
          GOBIN="$RUNNER_TEMP/actionlint-bin" go install "github.com/rhysd/actionlint/cmd/actionlint@v$ACTIONLINT_VERSION"
          "$RUNNER_TEMP/actionlint-bin/actionlint" -version
          "$RUNNER_TEMP/actionlint-bin/actionlint" .github/workflows/*.yml

      - name: Validate release metadata and tooling
        run: |
          node tools/validate-release.mjs
          for script in tools/*.mjs; do node --check "$script"; done
          bash -n tools/*.sh
          shellcheck tools/*.sh
          python -m unittest discover -s tests -p 'test_*.py'
          node --test tests/*.test.mjs
          tools/test-native.sh

      - name: Bootstrap locked Arduino toolchain
        run: tools/bootstrap.sh

      - name: Build twice, verify generated files, and compare hashes
        run: |
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$GITHUB_SHA")"
          export SOURCE_DATE_EPOCH
          export ARDUINO_DIRECTORIES_DATA="$PWD/.cache/arduino/data"
          export ARDUINO_DIRECTORIES_DOWNLOADS="$PWD/.cache/arduino/downloads"
          export ARDUINO_DIRECTORIES_USER="$PWD/.cache/arduino/user"
          node tools/gen-assets.mjs --check
          tools/build.sh
          node tools/gen-assets.mjs --check
          mkdir -p "$RUNNER_TEMP/repro-first"
          cp -- build/*.bin "$RUNNER_TEMP/repro-first/"
          (cd "$RUNNER_TEMP/repro-first" && sha256sum ./*.bin) > "$RUNNER_TEMP/first.sha256"
          tools/build.sh
          node tools/gen-assets.mjs --check
          (cd build && sha256sum ./*.bin) > "$RUNNER_TEMP/second.sha256"
          diff -u "$RUNNER_TEMP/first.sha256" "$RUNNER_TEMP/second.sha256"
          tools/package-m5burner.sh
          node tools/generate-sbom.mjs build
          node tools/package-release.mjs
          (cd build && sha256sum --check SHA256SUMS)

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hotspot-arcade-cardputer
          if-no-files-found: error
          path: |
            build/hotspot-arcade-cardputer.ino.bin
            build/hotspot-arcade-cardputer.full.bin
            build/hotspot-arcade-cardputer-m5burner.zip
            build/hotspot-arcade-cardputer.spdx.json
            build/build-manifest.json
            build/SHA256SUMS
            firmware/cardputer/
