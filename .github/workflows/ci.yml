name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Bootstrap checksum-pinned Node
        run: tools/bootstrap-node.sh

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install checksum-pinned Python dependencies
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          -r tools/requirements-release.txt

      - name: Bootstrap locked actionlint
        run: tools/bootstrap-ci-tools.sh actionlint

      - name: Validate scripts, generators, and native policies
        run: |
          actionlint .github/workflows/*.yml
          for script in tools/*.mjs; do node --check "$script"; done
          bash -n tools/*.sh
          shellcheck tools/*.sh
          python -m unittest discover -s tests -p 'test_*.py'
          node --test tests/*.test.mjs
          tools/test-native.sh
          tools/test-native.sh --tsan
          node tools/gen-assets.mjs
          sha256sum hotspot-arcade-cardputer/{ha_bundle,ha_metadata,ha_proto,ha_json,ha_games}.h > "$RUNNER_TEMP/generated-first.sha256"
          node tools/gen-assets.mjs
          sha256sum hotspot-arcade-cardputer/{ha_bundle,ha_metadata,ha_proto,ha_json,ha_games}.h > "$RUNNER_TEMP/generated-second.sha256"
          diff -u "$RUNNER_TEMP/generated-first.sha256" "$RUNNER_TEMP/generated-second.sha256"
          node tools/gen-assets.mjs --check

      - name: Bootstrap locked Arduino toolchain
        run: tools/bootstrap.sh

      - name: Build twice and compare firmware
        run: |
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$GITHUB_SHA")"
          export SOURCE_DATE_EPOCH
          tools/build.sh
          (cd build && sha256sum ./*.bin) > "$RUNNER_TEMP/build-first.sha256"
          tools/build.sh
          (cd build && sha256sum ./*.bin) > "$RUNNER_TEMP/build-second.sha256"
          diff -u "$RUNNER_TEMP/build-first.sha256" "$RUNNER_TEMP/build-second.sha256"
