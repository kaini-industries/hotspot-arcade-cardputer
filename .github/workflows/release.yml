name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      candidate:
        description: Prerelease version to build without publishing
        required: true
        default: 0.6.0-rc.1
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      artifact-name: ${{ steps.release-context.outputs.artifact-name }}
      release-tag: ${{ steps.release-context.outputs.release-tag }}
      candidate: ${{ steps.release-context.outputs.candidate }}
      source-commit: ${{ steps.release-context.outputs.source-commit }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Bootstrap checksum-pinned Node
        run: tools/bootstrap-node.sh

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Resolve immutable release context
        id: release-context
        env:
          REQUESTED_CANDIDATE: ${{ inputs.candidate }}
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          SOURCE_COMMIT="$(git rev-parse --verify "$GITHUB_SHA^{commit}")"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
            ARTIFACT_NAME="release-$GITHUB_REF_NAME"
            IS_CANDIDATE=false
          else
            [[ "$REQUESTED_CANDIDATE" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[1-9][0-9]*$ ]]
            [[ "$REQUESTED_CANDIDATE" == "$VERSION-rc."* ]]
            RELEASE_TAG="v$REQUESTED_CANDIDATE"
            ARTIFACT_NAME="candidate-$REQUESTED_CANDIDATE-${GITHUB_SHA:0:12}"
            IS_CANDIDATE=true
          fi
          {
            printf 'release-tag=%s\n' "$RELEASE_TAG"
            printf 'artifact-name=%s\n' "$ARTIFACT_NAME"
            printf 'candidate=%s\n' "$IS_CANDIDATE"
            printf 'source-commit=%s\n' "$SOURCE_COMMIT"
          } >> "$GITHUB_OUTPUT"

      - name: Install hashed Python test dependencies
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          -r tools/requirements-release.txt

      - name: Bootstrap checksum-pinned CI tools
        run: tools/bootstrap-ci-tools.sh

      - name: Run locked actionlint
        run: |
          ACTIONLINT_VERSION="$(node -p "require('./tools/toolchain.lock.json').hostTools.actionlint.version")"
          test "$(actionlint -version)" = "$ACTIONLINT_VERSION"
          actionlint .github/workflows/*.yml

      - name: Validate release tag, metadata, and tooling
        env:
          RELEASE_TAG: ${{ steps.release-context.outputs.release-tag }}
          IS_CANDIDATE: ${{ steps.release-context.outputs.candidate }}
        run: |
          VALIDATE_ARGS=(--tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY")
          if [[ "$IS_CANDIDATE" == true ]]; then VALIDATE_ARGS+=(--candidate); fi
          node tools/validate-release.mjs "${VALIDATE_ARGS[@]}"
          if [[ "$IS_CANDIDATE" == false ]]; then
            TAG_COMMIT="$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
            test "$TAG_COMMIT" = "${{ steps.release-context.outputs.source-commit }}"
          fi
          git merge-base --is-ancestor "${{ steps.release-context.outputs.source-commit }}" origin/main
          for script in tools/*.mjs; do node --check "$script"; done
          bash -n tools/*.sh
          shellcheck tools/*.sh
          python -m unittest discover -s tests -p 'test_*.py'
          node --test tests/*.test.mjs
          tools/test-native.sh
          tools/test-native.sh --tsan

      - name: Bootstrap locked Arduino toolchain
        run: tools/bootstrap.sh

      - name: Expose locked esptool
        run: |
          ESPTOOL_VERSION="$(node -p "require('./tools/toolchain.lock.json').hostTools.esptool.version")"
          ESPTOOL_DIR="$PWD/.cache/arduino/data/packages/esp32/tools/esptool_py/$ESPTOOL_VERSION"
          test -x "$ESPTOOL_DIR/esptool"
          ESPTOOL_ACTUAL="$("$ESPTOOL_DIR/esptool" version | awk 'NR == 1 { sub(/^v/, "", $2); print $2 }')"
          test "$ESPTOOL_ACTUAL" = "$ESPTOOL_VERSION"
          printf '%s\n' "$ESPTOOL_DIR" >> "$GITHUB_PATH"

      - name: Build two isolated release candidates and compare every hash
        env:
          RELEASE_TAG: ${{ steps.release-context.outputs.release-tag }}
          IS_CANDIDATE: ${{ steps.release-context.outputs.candidate }}
          RELEASE_COMMIT: ${{ steps.release-context.outputs.source-commit }}
        run: |
          REPRO_WORKTREE="$RUNNER_TEMP/hotspot-repro-worktree"
          REPRO_FIRST="$RUNNER_TEMP/hotspot-repro-first"
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$RELEASE_COMMIT")"
          export SOURCE_DATE_EPOCH
          export ARDUINO_DIRECTORIES_DATA="$PWD/.cache/arduino/data"
          export ARDUINO_DIRECTORIES_DOWNLOADS="$PWD/.cache/arduino/downloads"
          export ARDUINO_DIRECTORIES_USER="$PWD/.cache/arduino/user"
          ARDUINO_CLI="$(command -v arduino-cli)"
          export ARDUINO_CLI
          git worktree add --detach "$REPRO_WORKTREE" "$RELEASE_COMMIT"
          BUILD_ARGS=(--tag "$RELEASE_TAG")
          if [[ "$IS_CANDIDATE" == true ]]; then BUILD_ARGS+=(--candidate); fi
          "$REPRO_WORKTREE/tools/build-release-candidate.sh" "${BUILD_ARGS[@]}"
          node "$REPRO_WORKTREE/tools/release-hashes.mjs" "$REPRO_WORKTREE" > "$RUNNER_TEMP/first.sha256"
          mkdir -p "$REPRO_FIRST"
          cp -R "$REPRO_WORKTREE/build" "$REPRO_FIRST/build"
          cp -R "$REPRO_WORKTREE/firmware" "$REPRO_FIRST/firmware"
          git worktree remove --force "$REPRO_WORKTREE"
          git worktree add --detach "$REPRO_WORKTREE" "$RELEASE_COMMIT"
          "$REPRO_WORKTREE/tools/build-release-candidate.sh" "${BUILD_ARGS[@]}"
          node "$REPRO_WORKTREE/tools/release-hashes.mjs" "$REPRO_WORKTREE" > "$RUNNER_TEMP/second.sha256"
          diff -u "$RUNNER_TEMP/first.sha256" "$RUNNER_TEMP/second.sha256"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.release-context.outputs.artifact-name }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/hotspot-repro-first/build/hotspot-arcade-cardputer.ino.bin
            ${{ runner.temp }}/hotspot-repro-first/build/hotspot-arcade-cardputer.full.bin
            ${{ runner.temp }}/hotspot-repro-first/build/hotspot-arcade-cardputer-m5burner.zip
            ${{ runner.temp }}/hotspot-repro-first/build/hotspot-arcade-cardputer.spdx.json
            ${{ runner.temp }}/hotspot-repro-first/build/build-manifest.json
            ${{ runner.temp }}/hotspot-repro-first/build/SHA256SUMS
            ${{ runner.temp }}/hotspot-repro-first/firmware/cardputer/

  attest-build-provenance:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: .

      - name: Attest release build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            build/hotspot-arcade-cardputer.ino.bin
            build/hotspot-arcade-cardputer.full.bin
            build/hotspot-arcade-cardputer-m5burner.zip
            build/hotspot-arcade-cardputer.spdx.json
            build/build-manifest.json
            build/SHA256SUMS
            firmware/cardputer/*.bin

  verify-build-provenance:
    needs: [build, attest-build-provenance]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Bootstrap checksum-pinned GitHub CLI
        run: tools/bootstrap-ci-tools.sh githubCli

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: .

      - name: Verify every release subject against this workflow
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.build.outputs.source-commit }}
        run: |
          while IFS= read -r artifact; do
            gh attestation verify "$artifact" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-digest "$RELEASE_COMMIT" \
              --source-ref "$GITHUB_REF" \
              --deny-self-hosted-runners
          done < <(find build firmware/cardputer -type f -print | LC_ALL=C sort)

  draft-github-release:
    if: github.event_name == 'push'
    needs: [build, verify-build-provenance]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: .

      - name: Create or update draft release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          draft: true
          fail_on_unmatched_files: true
          body_path: docs/RELEASE_NOTES.md
          files: |
            build/hotspot-arcade-cardputer.ino.bin
            build/hotspot-arcade-cardputer.full.bin
            build/hotspot-arcade-cardputer-m5burner.zip
            build/hotspot-arcade-cardputer.spdx.json
            build/build-manifest.json
            build/SHA256SUMS

  publish-m5burner:
    if: github.event_name == 'push'
    needs: [build, draft-github-release]
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: .

      - name: Install locked publisher dependency
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          -r tools/requirements-release.txt

      - name: Publish to M5Burner
        env:
          M5BURNER_USER: ${{ secrets.M5BURNER_USER }}
          M5BURNER_PWD: ${{ secrets.M5BURNER_PWD }}
          RELEASE_TAG: ${{ needs.build.outputs.release-tag }}
          RELEASE_COMMIT: ${{ needs.build.outputs.source-commit }}
        run: >-
          python tools/m5burner_post.py --tag "$RELEASE_TAG"
          --expected-commit "$RELEASE_COMMIT" --artifacts-dir build

  finalize-github-release:
    if: github.event_name == 'push'
    needs: [build, publish-m5burner]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Bootstrap checksum-pinned GitHub CLI
        run: tools/bootstrap-ci-tools.sh githubCli

      - name: Publish the draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.release-tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false --repo "$GITHUB_REPOSITORY"
