name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      artifact-name: ${{ steps.release-context.outputs.artifact-name }}
      release-tag: ${{ steps.release-context.outputs.release-tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Resolve immutable release context
        id: release-context
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
            ARTIFACT_NAME="release-$GITHUB_REF_NAME"
          else
            RELEASE_TAG="v$VERSION"
            ARTIFACT_NAME="candidate-${GITHUB_SHA:0:12}"
          fi
          printf 'release-tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          printf 'artifact-name=%s\n' "$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"

      - name: Install hashed Python test dependencies
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          -r tools/requirements-release.txt

      - name: Install and run locked actionlint
        run: |
          ACTIONLINT_VERSION="$(node -p "require('./tools/toolchain.lock.json').hostTools.actionlint.version")"
          mkdir -p "$RUNNER_TEMP/actionlint-bin"
          GOBIN="$RUNNER_TEMP/actionlint-bin" go install "github.com/rhysd/actionlint/cmd/actionlint@v$ACTIONLINT_VERSION"
          "$RUNNER_TEMP/actionlint-bin/actionlint" -version
          "$RUNNER_TEMP/actionlint-bin/actionlint" .github/workflows/*.yml

      - name: Validate release tag, metadata, and tooling
        env:
          RELEASE_TAG: ${{ steps.release-context.outputs.release-tag }}
        run: |
          node tools/validate-release.mjs \
            --tag "$RELEASE_TAG" \
            --repository "$GITHUB_REPOSITORY"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          for script in tools/*.mjs; do node --check "$script"; done
          bash -n tools/*.sh
          shellcheck tools/*.sh
          python -m unittest discover -s tests -p 'test_*.py'
          node --test tests/*.test.mjs
          tools/test-native.sh
          tools/test-native.sh --tsan

      - name: Bootstrap locked Arduino toolchain
        run: tools/bootstrap.sh

      - name: Expose locked esptool
        run: |
          ESPTOOL_VERSION="$(node -p "require('./tools/toolchain.lock.json').hostTools.esptool.version")"
          ESPTOOL_DIR="$PWD/.cache/arduino/data/packages/esp32/tools/esptool_py/$ESPTOOL_VERSION"
          test -x "$ESPTOOL_DIR/esptool"
          ESPTOOL_ACTUAL="$("$ESPTOOL_DIR/esptool" version | awk 'NR == 1 { sub(/^v/, "", $2); print $2 }')"
          test "$ESPTOOL_ACTUAL" = "$ESPTOOL_VERSION"
          printf '%s\n' "$ESPTOOL_DIR" >> "$GITHUB_PATH"

      - name: Build two isolated release candidates and compare every hash
        env:
          RELEASE_TAG: ${{ steps.release-context.outputs.release-tag }}
        run: |
          REPRO_WORKTREE="$RUNNER_TEMP/hotspot-repro-worktree"
          REPRO_FIRST="$RUNNER_TEMP/hotspot-repro-first"
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$GITHUB_SHA")"
          export SOURCE_DATE_EPOCH
          export ARDUINO_DIRECTORIES_DATA="$PWD/.cache/arduino/data"
          export ARDUINO_DIRECTORIES_DOWNLOADS="$PWD/.cache/arduino/downloads"
          export ARDUINO_DIRECTORIES_USER="$PWD/.cache/arduino/user"
          ARDUINO_CLI="$(command -v arduino-cli)"
          export ARDUINO_CLI
          git worktree add --detach "$REPRO_WORKTREE" "$GITHUB_SHA"
          "$REPRO_WORKTREE/tools/build-release-candidate.sh" --tag "$RELEASE_TAG"
          node "$REPRO_WORKTREE/tools/release-hashes.mjs" "$REPRO_WORKTREE" > "$RUNNER_TEMP/first.sha256"
          mkdir -p "$REPRO_FIRST"
          cp -R "$REPRO_WORKTREE/build" "$REPRO_FIRST/build"
          cp -R "$REPRO_WORKTREE/firmware" "$REPRO_FIRST/firmware"
          git worktree remove --force "$REPRO_WORKTREE"
          git worktree add --detach "$REPRO_WORKTREE" "$GITHUB_SHA"
          "$REPRO_WORKTREE/tools/build-release-candidate.sh" --tag "$RELEASE_TAG"
          node "$REPRO_WORKTREE/tools/release-hashes.mjs" "$REPRO_WORKTREE" > "$RUNNER_TEMP/second.sha256"
          diff -u "$RUNNER_TEMP/first.sha256" "$RUNNER_TEMP/second.sha256"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.release-context.outputs.artifact-name }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/hotspot-repro-first/build/hotspot-arcade-cardputer.ino.bin
            ${{ runner.temp }}/hotspot-repro-first/build/hotspot-arcade-cardputer.full.bin
            ${{ runner.temp }}/hotspot-repro-first/build/hotspot-arcade-cardputer-m5burner.zip
            ${{ runner.temp }}/hotspot-repro-first/build/hotspot-arcade-cardputer.spdx.json
            ${{ runner.temp }}/hotspot-repro-first/build/build-manifest.json
            ${{ runner.temp }}/hotspot-repro-first/build/SHA256SUMS
            ${{ runner.temp }}/hotspot-repro-first/firmware/cardputer/

  attest-build-provenance:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: .

      - name: Attest release build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            build/hotspot-arcade-cardputer.ino.bin
            build/hotspot-arcade-cardputer.full.bin
            build/hotspot-arcade-cardputer-m5burner.zip
            build/hotspot-arcade-cardputer.spdx.json
            build/build-manifest.json
            build/SHA256SUMS
            firmware/cardputer/*.bin

  verify-build-provenance:
    needs: [build, attest-build-provenance]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: .

      - name: Verify every release subject against this workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while IFS= read -r artifact; do
            gh attestation verify "$artifact" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          done < <(find build firmware/cardputer -type f -print | LC_ALL=C sort)

  draft-github-release:
    if: github.event_name == 'push'
    needs: [build, verify-build-provenance]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: .

      - name: Create or update draft release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          draft: true
          fail_on_unmatched_files: true
          body_path: docs/RELEASE_NOTES.md
          files: |
            build/hotspot-arcade-cardputer.ino.bin
            build/hotspot-arcade-cardputer.full.bin
            build/hotspot-arcade-cardputer-m5burner.zip
            build/hotspot-arcade-cardputer.spdx.json
            build/build-manifest.json
            build/SHA256SUMS

  publish-m5burner:
    if: github.event_name == 'push'
    needs: [build, draft-github-release]
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: .

      - name: Install locked publisher dependency
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          -r tools/requirements-release.txt

      - name: Publish to M5Burner
        env:
          M5BURNER_USER: ${{ secrets.M5BURNER_USER }}
          M5BURNER_PWD: ${{ secrets.M5BURNER_PWD }}
          RELEASE_TAG: ${{ needs.build.outputs.release-tag }}
        run: python tools/m5burner_post.py --tag "$RELEASE_TAG" --artifacts-dir build

  finalize-github-release:
    if: github.event_name == 'push'
    needs: [build, publish-m5burner]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Publish the draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.release-tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false --repo "$GITHUB_REPOSITORY"
