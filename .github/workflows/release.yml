name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install hashed Python test dependencies
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          -r tools/requirements-release.txt

      - name: Install and run locked actionlint
        run: |
          ACTIONLINT_VERSION="$(node -p "require('./tools/toolchain.lock.json').hostTools.actionlint.version")"
          mkdir -p "$RUNNER_TEMP/actionlint-bin"
          GOBIN="$RUNNER_TEMP/actionlint-bin" go install "github.com/rhysd/actionlint/cmd/actionlint@v$ACTIONLINT_VERSION"
          "$RUNNER_TEMP/actionlint-bin/actionlint" -version
          "$RUNNER_TEMP/actionlint-bin/actionlint" .github/workflows/*.yml

      - name: Validate release tag, metadata, and tooling
        run: |
          node tools/validate-release.mjs \
            --tag "$GITHUB_REF_NAME" \
            --repository "$GITHUB_REPOSITORY"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          for script in tools/*.mjs; do node --check "$script"; done
          bash -n tools/*.sh
          shellcheck tools/*.sh
          python -m unittest discover -s tests -p 'test_*.py'
          node --test tests/*.test.mjs
          tools/test-native.sh

      - name: Bootstrap locked Arduino toolchain
        run: tools/bootstrap.sh

      - name: Build twice, verify generated files, and compare hashes
        run: |
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$GITHUB_SHA")"
          export SOURCE_DATE_EPOCH
          export ARDUINO_DIRECTORIES_DATA="$PWD/.cache/arduino/data"
          export ARDUINO_DIRECTORIES_DOWNLOADS="$PWD/.cache/arduino/downloads"
          export ARDUINO_DIRECTORIES_USER="$PWD/.cache/arduino/user"
          node tools/gen-assets.mjs --check
          tools/build.sh
          node tools/gen-assets.mjs --check
          mkdir -p "$RUNNER_TEMP/repro-first"
          cp -- build/*.bin "$RUNNER_TEMP/repro-first/"
          (cd "$RUNNER_TEMP/repro-first" && sha256sum ./*.bin) > "$RUNNER_TEMP/first.sha256"
          tools/build.sh
          node tools/gen-assets.mjs --check
          (cd build && sha256sum ./*.bin) > "$RUNNER_TEMP/second.sha256"
          diff -u "$RUNNER_TEMP/first.sha256" "$RUNNER_TEMP/second.sha256"
          tools/package-m5burner.sh
          node tools/generate-sbom.mjs build
          node tools/package-release.mjs --tag "$GITHUB_REF_NAME"
          (cd build && sha256sum --check SHA256SUMS)

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            build/hotspot-arcade-cardputer.ino.bin
            build/hotspot-arcade-cardputer.full.bin
            build/hotspot-arcade-cardputer-m5burner.zip
            build/hotspot-arcade-cardputer.spdx.json
            build/build-manifest.json
            build/SHA256SUMS
            firmware/cardputer/

  attest-build-provenance:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-${{ github.ref_name }}
          path: .

      - name: Attest release build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            build/hotspot-arcade-cardputer.ino.bin
            build/hotspot-arcade-cardputer.full.bin
            build/hotspot-arcade-cardputer-m5burner.zip
            build/hotspot-arcade-cardputer.spdx.json
            build/build-manifest.json
            build/SHA256SUMS
            firmware/cardputer/*.bin

  draft-github-release:
    needs: [build, attest-build-provenance]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-${{ github.ref_name }}
          path: .

      - name: Create or update draft release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          draft: true
          fail_on_unmatched_files: true
          body_path: docs/RELEASE_NOTES.md
          files: |
            build/hotspot-arcade-cardputer.ino.bin
            build/hotspot-arcade-cardputer.full.bin
            build/hotspot-arcade-cardputer-m5burner.zip
            build/hotspot-arcade-cardputer.spdx.json
            build/build-manifest.json
            build/SHA256SUMS

  publish-m5burner:
    needs: [build, draft-github-release]
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-${{ github.ref_name }}
          path: .

      - name: Install locked publisher dependency
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          -r tools/requirements-release.txt

      - name: Publish to M5Burner
        env:
          M5BURNER_USER: ${{ secrets.M5BURNER_USER }}
          M5BURNER_PWD: ${{ secrets.M5BURNER_PWD }}
        run: python tools/m5burner_post.py --tag "$GITHUB_REF_NAME" --artifacts-dir build

  finalize-github-release:
    needs: publish-m5burner
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Publish the draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"
